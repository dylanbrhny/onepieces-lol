<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Pieces scenes</title>
<style>
  body { margin: 0; background: #0c1230; color: #f4ecd8; font: 14px/1.3 "Courier New", monospace; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  figure { margin: 0; }
  canvas { width: 100%; image-rendering: pixelated; display: block; border: 2px solid #3a4580; }
  figcaption { margin-top: 4px; color: #a9b1d6; }
</style>
</head>
<body>
<h1>Voyage scenes (painted in js/scenes.js). Open with ?wide for the in-game shape.</h1>
<div class="grid" id="grid"></div>
<script src="data/route.js"></script>
<script src="js/scenes.js"></script>
<script>
  const wide = location.search.includes("wide");
  const grid = document.getElementById("grid");
  (window.ROUTE_STOPS || []).forEach((st, i) => {
    const c = window.SceneArt.paint(st, wide ? 400 : 192, 96);
    const fig = document.createElement("figure");
    const cv = document.createElement("canvas"); cv.width = c.width; cv.height = c.height;
    cv.getContext("2d").drawImage(c, 0, 0);
    const cap = document.createElement("figcaption"); cap.textContent = `${i + 1}. ${st.name}`;
    fig.append(cv, cap); grid.appendChild(fig);
  });
</script>
</body>
</html>
