<!doctype html>
<!-- Draws the favicon set and the social share banner from the game's own sprite and font.
     Open http://127.0.0.1:8765/tools/brand.html with tools/... saver running, or just look and right-click save. -->
<html><head><meta charset="utf-8"><title>One Pieces brand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>body{background:#222;color:#eee;font:14px sans-serif;padding:16px} canvas{image-rendering:pixelated;margin:8px;border:1px solid #555;vertical-align:top}</style>
</head><body>
<div id="out"></div>
<script src="../js/sprites.js"></script>
<script>
const SP = window.SPRITES;
const rows = SP.ship.rows, W = Math.max(...rows.map(r => r.length)), H = rows.length;
function drawSprite(ctx, x, y, s) {
  rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch !== "." && SP.palette[ch]) { ctx.fillStyle = SP.palette[ch]; ctx.fillRect(x + i * s, y + j * s, s, s); }
  }));
}
function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; document.getElementById("out").appendChild(c); return c; }

// icon: night-sea square, gold rim, the ship riding a wave
function icon(size) {
  const c = canvas(size, size), x = c.getContext("2d"); x.imageSmoothingEnabled = false;
  const s = Math.max(1, Math.floor(size / 36));
  x.fillStyle = "#10183d"; x.fillRect(0, 0, size, size);
  x.fillStyle = "#1d4f8a"; x.fillRect(0, Math.round(size * 0.72), size, size);
  x.fillStyle = "#3d8fd6"; x.fillRect(0, Math.round(size * 0.72), size, Math.max(1, s));
  const sx = Math.round((size - W * s) / 2), sy = Math.round(size * 0.72 - (H - 4) * s);
  drawSprite(x, sx, sy, s);
  if (size >= 64) { x.strokeStyle = "#f1c04a"; x.lineWidth = s * 2; x.strokeRect(s, s, size - 2 * s, size - 2 * s); }
  return c;
}

// banner 1200x630: sunset sky in flat bands, sea, big ship, logo
function banner() {
  const c = canvas(1200, 630), x = c.getContext("2d"); x.imageSmoothingEnabled = false;
  const sky = ["#2c2160", "#5a3482", "#8a4380", "#b0517a", "#d9706a", "#f39a62"];
  sky.forEach((col, i) => { x.fillStyle = col; x.fillRect(0, i * 70, 1200, 70); });
  x.fillStyle = "#ffd36b"; for (let r = 60; r > 0; r -= 6) { x.globalAlpha = 0.18; x.beginPath(); x.arc(900, 400, r * 2.2, 0, 7); x.fill(); } x.globalAlpha = 1;
  x.fillStyle = "#fff3b0"; x.fillRect(840, 340, 120, 60);
  const seaY = 420; const sea = ["#3d8fd6", "#2a72b8", "#1d5591", "#143d6b"];
  sea.forEach((col, i) => { x.fillStyle = col; x.fillRect(0, seaY + i * 55, 1200, 220); });
  x.fillStyle = "#ffd2b0"; for (let i = 0; i < 1200; i += 36) x.fillRect(i + (i % 72 ? 10 : 0), seaY, 16, 4);
  for (let i = 0; i < 40; i++) { x.fillStyle = "rgba(255,255,255,.25)"; x.fillRect((i * 97) % 1200, seaY + 30 + (i * 53) % 180, 12, 3); }
  drawSprite(x, 820, seaY - (H - 4) * 8, 8);
  // logo
  x.textBaseline = "top"; x.textAlign = "left";
  x.font = "96px 'Press Start 2P'";
  x.fillStyle = "#050818"; x.fillText("ONE PIECES", 72 + 12, 92 + 12);
  x.fillStyle = "#8e2a1c"; x.fillText("ONE PIECES", 72 + 6, 92 + 6);
  x.fillStyle = "#f1c04a"; x.fillText("ONE PIECES", 72, 92);
  x.font = "26px 'Press Start 2P'"; x.fillStyle = "#6fe3ff";
  x.fillText("THE DAILY ONE PIECE VOYAGE", 76, 230);
  x.font = "38px VT323"; x.fillStyle = "#f4ecd8";
  x.fillText("Name the rarest right answer.", 78, 290);
  x.fillText("Sail further than everyone else.", 78, 330);
  x.font = "22px 'Press Start 2P'"; x.fillStyle = "#050818"; x.fillRect(64, 540, 360, 50);
  x.fillStyle = "#f1c04a"; x.fillText("ONEPIECES.LOL", 80, 554);
  return c;
}

async function save(c, name) {
  const r = await fetch("http://127.0.0.1:8799/save?name=" + name, { method: "POST", headers: { "Content-Type": "text/plain" }, body: c.toDataURL("image/png") });
  return r.text();
}
window.makeAll = async () => {
  await document.fonts.load("96px 'Press Start 2P'"); await document.fonts.load("38px VT323");
  const out = [];
  for (const [size, name] of [[16, "favicon-16.png"], [32, "favicon-32.png"], [180, "apple-touch-icon.png"], [192, "icon-192.png"], [512, "icon-512.png"]]) out.push(await save(icon(size), name));
  out.push(await save(banner(), "og-banner.png"));
  return out;
};
</script>
</body></html>
